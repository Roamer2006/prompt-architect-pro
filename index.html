<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172554"><meta name="description" content="Prompt Architect Pro - 专业提示词生成工作台"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>Prompt Architect Pro</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans SC',sans-serif;color:#17233a;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:18px 16px 90px}header{background:linear-gradient(125deg,#172554,#3258a8);color:white;padding:26px 20px;border-radius:20px;margin-bottom:16px}header h1{margin:0 0 8px;font-size:25px}header p{margin:0;opacity:.85;font-size:13px}.card{background:white;border:1px solid #e4e9f2;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #17255408}h2{font-size:16px;margin:0 0 14px}label{font-weight:650;font-size:13px;display:block;margin:12px 0 7px}textarea,input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white;font:inherit;font-size:14px}textarea{resize:vertical;min-height:72px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #cbd5e1;background:white;border-radius:11px;padding:10px 12px;color:#334155;font-weight:600}.chip.active{background:#e8efff;border-color:#3658b2;color:#193b8a}.muted{color:#64748b;font-size:12px;line-height:1.6}.rule{padding:7px 0;border-bottom:1px solid #f0f2f6;font-size:13px}.rule:before{content:'✓';color:#13845b;margin-right:9px}.meter{height:10px;background:#e5eaf3;border-radius:99px;overflow:hidden}.fill{height:100%;background:#2563eb;transition:width .2s}.score{font-size:29px;font-weight:800;color:#1e40af}.missing{font-size:13px;color:#855e17;padding:6px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#244da3;border:0;border-radius:11px;padding:13px 15px;color:white;font-weight:700;flex:1;min-width:120px}.btn.secondary{background:#e8efff;color:#234587}.btn:disabled{opacity:.5}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}.checks label{margin:0;font-weight:500}.checks input{width:auto;margin-right:6px}pre{white-space:pre-wrap;word-break:break-word;background:#f5f7fb;border-radius:12px;padding:14px;font:12px/1.65 system-ui;max-height:380px;overflow:auto}.history-item{padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0;display:flex;align-items:center;gap:8px}.history-item span{flex:1;font-size:13px}.history-item button{border:0;background:#eef2ff;border-radius:8px;padding:8px;color:#1e40af}.hidden{display:none!important}footer{text-align:center;font-size:11px;color:#64748b;margin:25px 0}@media(min-width:600px){.app{padding-top:26px}}
</style></head><body><main class="app"><header><h1>✦ Prompt Architect Pro</h1><p>V2.0 · 一句话生成专业提示词 · 离线可用</p></header><section class="card"><h2>01 · 描述你的任务</h2><textarea id="task" placeholder="例如：根据项目周报制作管理层PPT，内容不变，突出风险和决策事项"></textarea><label>快速示例</label><div class="chips" id="examples"></div><label>专业任务预设</label><div class="chips" id="presets"></div><p class="muted" id="detected"></p></section><section class="card"><h2>02 · 提示词质量评分 <span class="score" id="score">0</span><span class="muted"> /100</span></h2><div class="meter"><div class="fill" id="fill"></div></div><p class="muted">基于输入完整度的启发式评分，不代表最终成果质量。</p><div id="missing"></div></section><section class="card"><h2>03 · 专业执行规则</h2><div id="rules"></div></section><section class="card"><h2>04 · 高级配置（选填）</h2><label>背景 / 资料来源</label><textarea id="context" placeholder="受众、业务背景、已有附件、已确认决策"></textarea><label>硬性约束</label><textarea id="constraints" placeholder="内容不能改变、模板不变、预算限制等"></textarea><label>验收标准</label><textarea id="criteria" placeholder="如何判断交付成果合格"></textarea><label>交付形式</label><select id="format"><option value="auto">智能选择</option><option>PPTX演示文稿</option><option>Word DOCX文档</option><option>Excel XLSX工作簿</option><option>邮件主题与正文</option><option>分析报告</option><option>表格与行动清单</option></select><label>分析深度</label><select id="depth"><option value="standard">专业标准</option><option value="brief">高效简洁</option><option value="deep">专家级深度</option></select><label>信息不充分时</label><select id="questions"><option value="critical">仅问关键问题</option><option value="confirm">重要歧义先确认</option><option value="autonomous">尽量自主推进</option></select><label>增强能力</label><div class="checks"><label><input type="checkbox" id="qa" checked>交付质量检查</label><label><input type="checkbox" id="risk" checked>风险与依赖</label><label><input type="checkbox" id="sources" checked>来源核实</label><label><input type="checkbox" id="actions" checked>可执行行动</label></div></section><section class="card"><h2>05 · 生成的提示词</h2><pre id="output">请先输入你的任务。</pre><div class="buttons"><button class="btn" id="copy">复制提示词</button><button class="btn secondary" id="share">分享到 ChatGPT</button><button class="btn secondary" id="save">保存到本地</button></div><p id="status" class="muted" aria-live="polite"></p></section><section class="card"><h2>本地历史记录</h2><div id="history"></div><div class="buttons"><button class="btn secondary" id="install" hidden>安装到手机桌面</button><button class="btn secondary" id="clear">清空历史</button></div></section><footer>所有任务与历史记录保存在当前设备浏览器中 · 不上传服务器</footer></main><script src="app.js"></script></body></html>
